<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a10">
<title>My Shuffler</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
:root{
  color-scheme:dark;
  --accent:#ef3b39;
  --accent-soft:rgba(239,59,57,.22);
  --accent-glow:rgba(239,59,57,.30);
  --bg:#070a10;
}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  min-height:100vh;
  color:#fff;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,var(--accent-soft),transparent 33%),
    linear-gradient(180deg,#0c1018 0%,#070a10 58%,#05070b 100%);
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:999;
  pointer-events:none;
  opacity:.085;
  mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E");
  background-size:180px 180px;
}
.app{
  width:min(980px,100%);
  margin:0 auto;
  padding:26px 16px 44px;
}
.header{
  text-align:center;
  padding:4px 0 24px;
}
.brand{
  display:inline-block;
  position:relative;
  font-family:"Snell Roundhand","Segoe Script","Brush Script MT",cursive;
  font-size:clamp(44px,9vw,72px);
  line-height:.95;
  font-weight:700;
  transform:rotate(-1.5deg);
  text-shadow:0 8px 28px rgba(255,255,255,.12);
}
.brand::after{
  content:"";
  position:absolute;
  left:14%;right:-2%;bottom:-10px;
  height:3px;border-radius:999px;
  background:linear-gradient(90deg,transparent,var(--accent) 18%,var(--accent) 82%,transparent);
  box-shadow:0 0 18px var(--accent-glow);
}
.subtitle{
  margin-top:24px;
  color:#858c9d;
  font-size:11px;
  letter-spacing:5px;
  text-transform:uppercase;
}
.glass{
  border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(180deg,rgba(255,255,255,.095),rgba(255,255,255,.025));
  -webkit-backdrop-filter:blur(30px) saturate(140%);
  backdrop-filter:blur(30px) saturate(140%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(255,255,255,.035),
    0 30px 90px rgba(0,0,0,.42);
}
.hero{
  position:relative;
  overflow:hidden;
  border-radius:32px;
  min-height:0;
}
.hero-backdrop{
  position:absolute;
  inset:0;
  z-index:0;
  background-image:var(--hero-backdrop);
  background-size:cover;
  background-position:center;
  filter:saturate(.85) contrast(1.04) brightness(.55);
}
.hero-backdrop::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg,rgba(4,7,12,.25) 0%,rgba(4,7,12,.34) 35%,rgba(4,7,12,.78) 67%,rgba(4,7,12,.97) 100%),
    radial-gradient(circle at 50% 28%,transparent 0%,rgba(0,0,0,.22) 72%);
}
.hero-content{
  position:relative;
  z-index:2;
  min-height:0;
  padding:28px 28px 30px;
  display:flex;
  flex-direction:column;
}
.hero-logo-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:165px;
  margin-top:10px;
}
.hero-logo{
  display:block;
  width:min(520px,88%);
  height:150px;
  object-fit:contain;
  object-position:center;
  filter:drop-shadow(0 16px 34px var(--accent-glow));
}
.tagline{
  margin:4px auto 0;
  max-width:570px;
  text-align:center;
  color:#c0c5d0;
  font-size:17px;
  line-height:1.5;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}
.info-area{margin-top:clamp(20px,3.5vh,38px)}
.watch-line{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
}
.watch-label{
  color:#9aa1af;
  font-size:11px;
  font-weight:800;
  letter-spacing:3px;
}
.service-link{
  width:62px;height:34px;
  display:grid;
  place-items:center;
  padding-left:14px;
  border-left:1px solid rgba(255,255,255,.19);
  text-decoration:none;
}
.service-link img{
  width:100%;height:100%;
  object-fit:contain;
  filter:brightness(0) invert(1);
}
.episode{
  font-size:clamp(60px,12vw,98px);
  line-height:1;
  font-weight:1000;
  letter-spacing:-4px;
  background:linear-gradient(180deg,#fff 0%,color-mix(in srgb,var(--accent) 55%,white) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 10px 28px var(--accent-glow));
}
.episode-info{
  margin-top:9px;
  color:#a0a7b5;
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
}
.hero-actions{
  display:grid;
  gap:12px;
  margin-top:30px;
}
.btn{
  width:100%;
  min-height:70px;
  border-radius:22px;
  border:0;
  cursor:pointer;
  font-size:21px;
  font-weight:950;
  transition:transform .15s ease,filter .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.985)}
.btn-main{
  color:#0b0d10;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 84%,white 16%),var(--accent));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.30),
    0 14px 36px var(--accent-glow);
}
.btn-secondary{
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(180deg,rgba(255,255,255,.095),rgba(255,255,255,.045));
  -webkit-backdrop-filter:blur(24px);
  backdrop-filter:blur(24px);
}
.library{
  margin-top:24px;
  border-radius:32px;
  padding:22px 18px 18px;
}
.library-title{
  margin:0 10px 16px;
  color:#949baa;
  font-size:12px;
  font-weight:700;
  letter-spacing:4px;
  text-transform:uppercase;
}
.show-list{
  display:grid;
  gap:12px;
}
.show-row{
  --row:#f2c94c;
  display:grid;
  grid-template-columns:92px 1fr auto auto;
  align-items:center;
  gap:18px;
  min-height:106px;
  padding:12px 18px 12px 12px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.12);
  background:
    radial-gradient(circle at 13% 50%,color-mix(in srgb,var(--row) 16%,transparent),transparent 32%),
    linear-gradient(90deg,rgba(24,28,38,.76),rgba(13,17,24,.72));
  -webkit-backdrop-filter:blur(22px) saturate(130%);
  backdrop-filter:blur(22px) saturate(130%);
  cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.show-row:active{transform:scale(.992)}
.show-row.active{
  border-color:var(--row);
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb,var(--row) 48%,transparent),
    0 0 28px color-mix(in srgb,var(--row) 17%,transparent);
}
.show-icon{
  width:78px;height:78px;
  border-radius:18px;
  display:grid;
  place-items:center;
  padding:8px;
  overflow:hidden;
  background:var(--row);
}
.show-icon img{
  width:100%;height:100%;
  object-fit:contain;
  filter:brightness(0);
}
.show-name{font-size:20px;font-weight:950}
.show-row.active .show-name{color:var(--row)}
.show-place{margin-top:4px;color:#89909f;font-size:14px}
.row-watch{
  display:flex;
  align-items:center;
  gap:13px;
  padding-left:20px;
  border-left:1px solid rgba(255,255,255,.12);
}
.row-watch-label{
  color:#8d94a3;
  font-size:10px;
  letter-spacing:3px;
}
.row-service{
  width:64px;height:36px;
  display:grid;
  place-items:center;
  text-decoration:none;
}
.row-service img{
  width:100%;height:100%;
  object-fit:contain;
  filter:brightness(0) invert(1);
}
.chev{font-size:40px;color:#8e95a4;font-weight:200;line-height:1}
.surprise{
  width:100%;
  min-height:52px;
  margin-top:14px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.04);
  color:#bbc1cd;
  font-weight:800;
  cursor:pointer;
}
.footer{
  margin-top:18px;
  text-align:center;
  color:#626978;
  font-size:10px;
  line-height:1.5;
}
@media(max-width:650px){
  .app{padding:20px 12px 34px}
  .hero,.hero-content{min-height:0}
  .hero-content{padding:22px 20px}
  .hero-logo-wrap{min-height:145px}
  .hero-logo{height:125px}
  .tagline{font-size:15px}
  .episode{letter-spacing:-3px}
  .episode-info{letter-spacing:1.8px}
  .btn{min-height:65px;font-size:19px}
  .show-row{
    grid-template-columns:72px 1fr auto;
    min-height:92px;
    gap:12px;
    padding:10px 12px 10px 10px;
  }
  .show-icon{width:62px;height:62px;border-radius:16px}
  .show-name{font-size:17px}
  .show-place{font-size:13px}
  .row-watch{border-left:0;padding-left:0}
  .row-watch-label{display:none}
  .row-service{width:52px;height:30px}
  .chev{display:none}
}

.surprise{
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding:10px 16px 11px;
  color:#fff;
  background:
    linear-gradient(#11151d,#11151d) padding-box,
    linear-gradient(110deg,#ff4d6d,#ffb84d,#fff35c,#55e88b,#55c8ff,#9d72ff,#ff66c4) border-box;
  border:1px solid transparent;
  box-shadow:0 8px 28px rgba(0,0,0,.20);
}
.surprise::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.13;
  background:linear-gradient(110deg,#ff4d6d,#ffb84d,#fff35c,#55e88b,#55c8ff,#9d72ff,#ff66c4);
}
.surprise > *{position:relative;z-index:1}
.surprise-icon{
  display:block;
  font-size:25px;
  line-height:1;
  font-weight:900;
  background:linear-gradient(110deg,#ff5470,#ffc44d,#fff36b,#63ee99,#5dd7ff,#a984ff,#ff75cf);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 9px rgba(160,130,255,.30));
}


.watch-line{
  width:100%;
}
.surprise-mini{
  margin-left:auto;
  min-height:34px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border-radius:13px;
  border:1px solid transparent;
  color:#f7f7fb;
  font-size:11px;
  font-weight:850;
  letter-spacing:.15px;
  cursor:pointer;
  white-space:nowrap;
  background:
    linear-gradient(rgba(14,17,24,.88),rgba(14,17,24,.88)) padding-box,
    linear-gradient(110deg,#ff4d6d,#ffb84d,#fff35c,#55e88b,#55c8ff,#9d72ff,#ff66c4) border-box;
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
.surprise-mini span{
  font-size:15px;
  line-height:1;
  background:linear-gradient(110deg,#ff5470,#ffc44d,#fff36b,#63ee99,#5dd7ff,#a984ff,#ff75cf);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.surprise-mini:active{transform:scale(.96)}
@media(max-width:380px){
  .surprise-mini{
    padding:0 9px;
    font-size:10px;
  }
}


/* Surprise Me under Again */
.surprise-hero{
  width:100%;
  min-height:70px;
  border-radius:22px;
  border:1px solid transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#f8f8fb;
  font-size:21px;
  font-weight:950;
  cursor:pointer;
  background:
    linear-gradient(rgba(13,16,23,.86),rgba(13,16,23,.86)) padding-box,
    linear-gradient(110deg,#ff4d6d,#ffb84d,#fff35c,#55e88b,#55c8ff,#9d72ff,#ff66c4) border-box;
  -webkit-backdrop-filter:blur(22px);
  backdrop-filter:blur(22px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
.surprise-hero span{
  font-size:18px;
  line-height:1;
  background:linear-gradient(110deg,#ff5470,#ffc44d,#fff36b,#63ee99,#5dd7ff,#a984ff,#ff75cf);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.surprise-hero:active{transform:scale(.985)}

/* Tighter, balanced bottom spacing */
.hero-actions{margin-top:24px;gap:10px}
.hero-content{padding-bottom:22px}
@media(max-width:650px){
  .hero-content{padding-bottom:18px}
  .hero-actions{margin-top:22px;gap:9px}
  .surprise-hero{min-height:65px;font-size:19px}
}


.episode-meta{
  margin-top:18px;
  padding:15px 17px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  backdrop-filter:blur(24px) saturate(140%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -1px 0 rgba(255,255,255,.025);
}
.episode-meta[hidden]{display:none}
.episode-title{
  font-size:17px;
  line-height:1.25;
  font-weight:900;
  color:#fff;
}
.episode-summary{
  margin-top:6px;
  font-size:13px;
  line-height:1.55;
  color:#b5bbc7;
}
.episode-summary.loading{
  opacity:.62;
  font-style:italic;
}


.episode-headline{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
}
.imdb-rating{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:6px 9px;
  border-radius:999px;
  border:1px solid rgba(255,215,64,.22);
  background:rgba(255,215,64,.08);
  color:#ffd84d;
  font-size:12px;
  line-height:1;
  font-weight:900;
  white-space:nowrap;
}
.imdb-rating[hidden]{display:none}
.imdb-rating .star{font-size:13px}
@media(max-width:460px){
  .episode-headline{gap:9px}
  .imdb-rating{font-size:11px;padding:5px 8px}
}

.library-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 10px 16px}
.library-head .library-title{margin:0}
.add-show-btn{min-height:36px;padding:0 12px;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);color:#fff;font-size:12px;font-weight:850;cursor:pointer;backdrop-filter:blur(18px)}
.modal-backdrop{position:fixed;inset:0;z-index:1000;display:grid;place-items:end center;padding:16px;background:rgba(2,4,8,.64);backdrop-filter:blur(10px)}
.modal-backdrop[hidden]{display:none}
.add-show-modal{width:min(700px,100%);max-height:82vh;overflow:auto;border-radius:28px;padding:20px}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.modal-kicker{font-size:10px;letter-spacing:3px;color:#8e95a4;font-weight:800}
.modal-title{margin-top:4px;font-size:28px;font-weight:950}
.modal-close{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:24px;line-height:1}
.search-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}
.show-search-input{min-height:48px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);color:#fff;padding:0 14px;font-size:16px;outline:none}
.show-search-btn{min-width:92px;border:0;border-radius:16px;background:#fff;color:#111;font-weight:900;padding:0 16px}
.show-search-status{min-height:24px;margin:14px 2px 6px;color:#9ba2b0;font-size:13px}
.show-search-results{display:grid;gap:10px}
.search-result{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;min-height:78px;padding:8px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04)}
.search-result img{width:64px;height:64px;object-fit:cover;border-radius:14px;background:#151922}
.search-result-title{font-size:16px;font-weight:900}
.search-result-meta{margin-top:3px;font-size:12px;color:#8f96a4}
.add-result-btn{min-height:38px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.08);color:#fff;font-weight:850}
@media(max-width:520px){.search-result{grid-template-columns:54px 1fr auto}.search-result img{width:54px;height:54px}.add-result-btn{padding:0 9px;font-size:12px}}


.library-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.remove-show-btn{
  min-height:36px;
  padding:0 12px;
  border-radius:13px;
  border:1px solid rgba(255,110,110,.18);
  background:rgba(255,90,90,.055);
  color:#ff9a9a;
  font-size:12px;
  font-weight:850;
  cursor:pointer;
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}
.remove-show-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}
@media(max-width:520px){
  .library-head{align-items:flex-start}
  .library-actions{gap:6px}
  .add-show-btn,.remove-show-btn{padding:0 10px;font-size:11px}
}

</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">My Shuffler</div>
    <div class="subtitle">Random episodes · good vibes</div>
  </header>

  <section class="hero glass">
    <div class="hero-backdrop"></div>
    <div class="hero-content">
      <div class="hero-logo-wrap">
        <img id="heroLogo" class="hero-logo" alt="">
      </div>
      <div id="tagline" class="tagline"></div>

      <div class="info-area">
        <div class="watch-line">
          <div class="watch-label">WATCH</div>
          <a id="heroService" class="service-link" target="_blank" rel="noopener">
            <img id="heroServiceLogo" alt="">
          </a>
        </div>

        <div id="episode" class="episode">S?? · E??</div>
        <div id="episodeInfo" class="episode-info">Pick a show and shuffle</div>
        <div id="episodeMeta" class="episode-meta" hidden>
          <div class="episode-headline">
            <div id="episodeTitle" class="episode-title"></div>
            <div id="imdbRating" class="imdb-rating" hidden></div>
          </div>
          <div id="episodeSummary" class="episode-summary"></div>
        </div>

        <div class="hero-actions">
          <button class="btn btn-main" onclick="shuffleSelected()">Shuffle Episode</button>
          <button class="btn btn-secondary" onclick="shuffleSelected()">↻ &nbsp;Again</button>
          <button class="surprise-hero" onclick="shuffleEverything()">
            <span>✦</span> Surprise Me
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="library glass">
    <div class="library-head">
  <div class="library-title">Choose a show</div>
  <div class="library-actions">
    <button id="addShowBtn" class="add-show-btn" onclick="openAddShow()">＋ Add Show</button>
    <button id="removeShowBtn" class="remove-show-btn" onclick="removeCurrentShow()">− Remove Show</button>
  </div>
</div>
    <div id="showList" class="show-list"></div>

  </section>

  <div id="addShowModal" class="modal-backdrop" hidden>
  <div class="add-show-modal glass">
    <div class="modal-top">
      <div>
        <div class="modal-kicker">ADD SHOW</div>
        <div class="modal-title">Search a series</div>
      </div>
      <button class="modal-close" onclick="closeAddShow()">×</button>
    </div>
    <div class="search-row">
      <input id="showSearchInput" class="show-search-input" type="search" placeholder="e.g. American Dad">
      <button class="show-search-btn" onclick="searchShows()">Search</button>
    </div>
    <div id="showSearchStatus" class="show-search-status"></div>
    <div id="showSearchResults" class="show-search-results"></div>
  </div>
</div>

<div class="footer">Broadcast-season numbering is used. Streaming services may group specials differently.</div>
</div>

<script>
const disneyLogo="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg";

</script>
<script src="shows.js"></script>
<script>


const CUSTOM_SHOWS_KEY="myShufflerCustomShows";

function loadCustomShows(){
  try{
    const custom=JSON.parse(localStorage.getItem(CUSTOM_SHOWS_KEY)||"{}");
    Object.entries(custom).forEach(([key,val])=>{shows[key]=val;});
  }catch(e){}
}

function saveCustomShow(key,show){
  let custom={};
  try{custom=JSON.parse(localStorage.getItem(CUSTOM_SHOWS_KEY)||"{}")}catch(e){}
  custom[key]=show;
  localStorage.setItem(CUSTOM_SHOWS_KEY,JSON.stringify(custom));
  shows[key]=show;
}

function slugifyShow(name,id){
  return ("custom-"+(id||name)).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

function stripTags(text){
  const d=document.createElement("div");
  d.innerHTML=text||"";
  return (d.textContent||"").trim();
}


function getCustomShows(){
  try{
    return JSON.parse(localStorage.getItem(CUSTOM_SHOWS_KEY)||"{}");
  }catch(e){
    return {};
  }
}

function updateRemoveButton(){
  const btn=document.getElementById("removeShowBtn");
  if(!btn) return;
  const custom=getCustomShows();
  const removable=Boolean(current && custom[current]);
  btn.disabled=!removable;
  btn.title=removable ? "Remove "+shows[current].name : "Only shows added with Add Show can be removed";
}

function removeCurrentShow(){
  const custom=getCustomShows();
  if(!current || !custom[current]) return;

  const showName=(shows[current]&&shows[current].name)||"this show";
  if(!window.confirm('Remove "'+showName+'" from My Shuffler?')) return;

  delete custom[current];
  localStorage.setItem(CUSTOM_SHOWS_KEY,JSON.stringify(custom));
  delete shows[current];

  const keys=Object.keys(shows);
  current=keys.length ? keys[0] : "";
  if(current){
    localStorage.setItem("lastShow",current);
    applyTheme();
    if(typeof clearEpisodeMeta==="function") clearEpisodeMeta();
    document.getElementById("episode").textContent="S?? · E??";
    document.getElementById("episodeInfo").textContent=
      shows[current].name.toUpperCase()+" — READY TO SHUFFLE";
  }
  drawShowList();
  updateRemoveButton();
}

function openAddShow(){
  document.getElementById("addShowModal").hidden=false;
  setTimeout(()=>document.getElementById("showSearchInput").focus(),80);
}
function closeAddShow(){
  document.getElementById("addShowModal").hidden=true;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeAddShow()});

async function searchShows(){
  const input=document.getElementById("showSearchInput");
  const q=input.value.trim();
  const status=document.getElementById("showSearchStatus");
  const results=document.getElementById("showSearchResults");
  if(!q) return;
  status.textContent="Searching…";
  results.innerHTML="";
  try{
    const res=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(q));
    if(!res.ok) throw new Error();
    const items=await res.json();
    if(!items.length){status.textContent="No shows found.";return}
    status.textContent="Choose the correct show:";
    items.slice(0,8).forEach(({show})=>{
      const row=document.createElement("div");
      row.className="search-result";
      const image=show.image?.medium||show.image?.original||"";
      const premiered=show.premiered?show.premiered.slice(0,4):"";
      const genres=(show.genres||[]).slice(0,2).join(" · ");
      row.innerHTML=`
        <img src="${image}" alt="">
        <div>
          <div class="search-result-title">${show.name}</div>
          <div class="search-result-meta">${[premiered,genres].filter(Boolean).join(" · ")}</div>
        </div>
        <button class="add-result-btn">Add</button>`;
      row.querySelector("button").onclick=()=>addShowFromTVMaze(show.id);
      results.appendChild(row);
    });
  }catch(err){
    status.textContent="Couldn't search right now.";
  }
}

async function addShowFromTVMaze(tvmazeId){
  const status=document.getElementById("showSearchStatus");
  status.textContent="Getting seasons and episodes…";
  try{
    const [showRes,episodesRes]=await Promise.all([
      fetch("https://api.tvmaze.com/shows/"+tvmazeId),
      fetch("https://api.tvmaze.com/shows/"+tvmazeId+"/episodes?specials=0")
    ]);
    if(!showRes.ok||!episodesRes.ok) throw new Error();
    const show=await showRes.json();
    const episodes=await episodesRes.json();

    const seasonMap={};
    episodes.forEach(ep=>{
      if(!ep.season||!ep.number) return;
      seasonMap[ep.season]=Math.max(seasonMap[ep.season]||0,ep.number);
    });
    const seasons=Object.keys(seasonMap).map(Number).sort((a,b)=>a-b);
    if(!seasons.length) throw new Error();
    const maxSeason=Math.max(...seasons);
    const counts=[];
    for(let n=1;n<=maxSeason;n++) counts.push(seasonMap[n]||0);

    const key=slugifyShow(show.name,tvmazeId);
    const customShow={
      name:show.name,
      place:(show.network&&show.network.name)||(show.webChannel&&show.webChannel.name)||"TV Series",
      accent:"#7e8cff",
      logo:(show.image&&show.image.original)||(show.image&&show.image.medium)||"",
      backdrop:(show.image&&show.image.original)||(show.image&&show.image.medium)||"",
      tagline:stripTags(show.summary).slice(0,150)||"Ready for a random episode.",
      service:{name:"Watch",logo:"",url:show.officialSite||show.url||"#"},
      counts:counts,
      tvmazeId:tvmazeId,
      custom:true
    };

    saveCustomShow(key,customShow);
    current=key;
    localStorage.setItem("lastShow",current);
    applyTheme();
    if(typeof clearEpisodeMeta==="function") clearEpisodeMeta();
    document.getElementById("episode").textContent="S?? · E??";
    document.getElementById("episodeInfo").textContent=show.name.toUpperCase()+" — READY TO SHUFFLE";
    updateRemoveButton();
    closeAddShow();
  }catch(err){
    status.textContent="Couldn't add this show automatically.";
  }
}

loadCustomShows();

let current=localStorage.getItem("lastShow");
if(!shows[current]) current="futurama";

function pickEpisode(key){
  const show=shows[key];
  const total=show.counts.reduce((a,b)=>a+b,0);
  let r=Math.floor(Math.random()*total);
  let season=0;
  while(r>=show.counts[season]){
    r-=show.counts[season];
    season++;
  }
  return {season:season+1,episode:r+1};
}

function drawShowList(){
  const box=document.getElementById("showList");
  box.innerHTML="";
  Object.entries(shows).forEach(([key,show])=>{
    const row=document.createElement("div");
    row.className="show-row"+(key===current?" active":"");
    row.style.setProperty("--row",show.accent);
    row.onclick=()=>selectShow(key);
    row.innerHTML=`
      <div class="show-icon"><img src="${show.logo}" alt="${show.name}"></div>
      <div>
        <div class="show-name">${show.name}</div>
        <div class="show-place">${show.place}</div>
      </div>
      <div class="row-watch">
        <div class="row-watch-label">WATCH</div>
        <a class="row-service"
           href="${show.service.url}"
           target="_blank"
           rel="noopener"
           onclick="event.stopPropagation()">
          ${show.service.logo ? `<img src="${show.service.logo}" alt="${show.service.name}">` : `<span style="font-size:11px;font-weight:900;color:#fff">WATCH</span>`}
        </a>
      </div>
      <div class="chev">›</div>`;
    box.appendChild(row);
  });
}

function applyTheme(){
  const show=shows[current];

  document.documentElement.style.setProperty("--accent",show.accent);
  document.documentElement.style.setProperty("--accent-soft",show.accent+"38");
  document.documentElement.style.setProperty("--accent-glow",show.accent+"4d");
  document.documentElement.style.setProperty("--hero-backdrop",`url("${show.backdrop}")`);

  document.getElementById("heroLogo").src=show.logo;
  document.getElementById("heroLogo").alt=show.name;
  document.getElementById("tagline").textContent=show.tagline;

  document.getElementById("heroService").href=show.service.url;
  document.getElementById("heroService").title="Watch on "+show.service.name;
  const heroServiceLogo=document.getElementById("heroServiceLogo");
  if(show.service.logo){
    heroServiceLogo.src=show.service.logo;
    heroServiceLogo.alt=show.service.name;
    heroServiceLogo.style.display="";
  }else{
    heroServiceLogo.removeAttribute("src");
    heroServiceLogo.alt=show.service.name;
    heroServiceLogo.style.display="none";
  }

  drawShowList();
  updateRemoveButton();
}

function selectShow(key){
  current=key;
  localStorage.setItem("lastShow",key);
  applyTheme();
  document.getElementById("episode").textContent="S?? · E??";
  document.getElementById("episodeInfo").textContent=
    shows[current].name.toUpperCase()+" — READY TO SHUFFLE";
  clearEpisodeMeta();
}

function stripHtml(html){
  const temp=document.createElement("div");
  temp.innerHTML=html||"";
  return (temp.textContent||temp.innerText||"").trim();
}

function clearEpisodeMeta(){
  const box=document.getElementById("episodeMeta");
  if(!box) return;
  box.hidden=true;
  document.getElementById("episodeTitle").textContent="";
  document.getElementById("episodeSummary").textContent="";
  document.getElementById("episodeSummary").classList.remove("loading");
  const rating=document.getElementById("imdbRating");
  if(rating){rating.hidden=true;rating.innerHTML="";}
}

async function getTVMazeShowId(showName){
  const cacheKey="tvmaze-id:"+showName;
  const cached=localStorage.getItem(cacheKey);
  if(cached) return Number(cached);

  const res=await fetch("https://api.tvmaze.com/search/shows?q="+encodeURIComponent(showName));
  if(!res.ok) throw new Error("TVMaze show search failed");
  const results=await res.json();
  if(!results.length) throw new Error("Show not found");

  const exact=results.find(x=>x.show && x.show.name.toLowerCase()===showName.toLowerCase());
  const item=exact||results[0];
  const id=item.show.id;
  localStorage.setItem(cacheKey,String(id));
  return id;
}


function getOMDbKey(){
  let key=localStorage.getItem("omdbApiKey");
  if(key) return key.trim();
  key=window.prompt("Enter your OMDb API key once. It will be stored only on this device:");
  if(!key) return "";
  key=key.trim();
  localStorage.setItem("omdbApiKey",key);
  return key;
}

async function loadIMDbRating(showName,season,episode){
  const badge=document.getElementById("imdbRating");
  if(!badge) return;
  badge.hidden=true;
  badge.innerHTML="";
  const key=getOMDbKey();
  if(!key) return;

  try{
    const url=
      "https://www.omdbapi.com/?apikey="+encodeURIComponent(key)+
      "&t="+encodeURIComponent(showName)+
      "&Season="+encodeURIComponent(season)+
      "&Episode="+encodeURIComponent(episode);
    const res=await fetch(url);
    if(!res.ok) throw new Error("OMDb request failed");
    const data=await res.json();
    const rating=data && data.imdbRating;
    if(data.Response==="False" || !rating || rating==="N/A") return;
    badge.innerHTML='<span class="star">★</span><span>IMDb '+rating+'/10</span>';
    badge.hidden=false;
  }catch(err){
    badge.hidden=true;
  }
}

async function loadEpisodeMeta(showName,season,episode){
  const box=document.getElementById("episodeMeta");
  const title=document.getElementById("episodeTitle");
  const summary=document.getElementById("episodeSummary");

  box.hidden=false;
  title.textContent="Loading episode details…";
  summary.textContent="";
  summary.classList.add("loading");

  try{
    const showId=await getTVMazeShowId(showName);
    const url=`https://api.tvmaze.com/shows/${showId}/episodebynumber?season=${season}&number=${episode}`;
    const res=await fetch(url);

    if(!res.ok) throw new Error("Episode metadata unavailable");
    const data=await res.json();

    title.textContent=data.name||`Season ${season}, Episode ${episode}`;
    const clean=stripHtml(data.summary);
    summary.classList.remove("loading");
    summary.textContent=clean || "No synopsis is available for this episode yet.";
  }catch(err){
    title.textContent="";
    summary.classList.remove("loading");
    summary.textContent="Episode synopsis isn't available for this numbering yet.";
  }
}

function shuffleSelected(){
  const ep=pickEpisode(current);
  const show=shows[current];

  document.getElementById("episode").textContent=
    "S"+String(ep.season).padStart(2,"0")+" · E"+String(ep.episode).padStart(2,"0");
  document.getElementById("episodeInfo").textContent=
    show.name.toUpperCase()+" — SEASON "+ep.season+", EPISODE "+ep.episode;

  loadEpisodeMeta(show.name,ep.season,ep.episode);
  loadIMDbRating(show.name,ep.season,ep.episode);

  if(navigator.vibrate) navigator.vibrate(30);
}

function shuffleEverything(){
  const keys=Object.keys(shows);
  current=keys[Math.floor(Math.random()*keys.length)];
  localStorage.setItem("lastShow",current);
  applyTheme();
  shuffleSelected();
}

applyTheme();
updateRemoveButton();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
